name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mytools-release
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select release version
        id: version
        run: node .github/scripts/release-version.cjs

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Create or resume draft release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const commit = process.env.RELEASE_COMMIT;
            let ref;
            try {
              ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref && (ref.object.type !== 'commit' || ref.object.sha !== commit)) {
              throw new Error(`Tag ${tag} does not point to the expected merge commit`);
            }
            if (!ref) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: commit });
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: tag,
                target_commitish: commit,
                draft: true, generate_release_notes: true
              })).data;
            }
            core.setOutput('draft', String(release.draft));
      - name: Upload packages and publish
        if: steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
